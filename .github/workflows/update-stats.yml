name: Update README Stats Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at 00:00 UTC
  workflow_dispatch:     # Allows manual trigger from the Actions tab

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats Card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mrmotabar&show_icons=true&count_private=true&theme=github_dark_dimmed&hide_border=true&bg_color=00000000
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages Card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mrmotabar&langs_count=8&layout=compact&theme=github_dark_dimmed&hide_border=true&bg_color=00000000&card_width=467
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Update GitHub Streak Card
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com?user=mrmotabar&theme=github-dark-dimmed&hide_border=true&background=00000000" \
            -o /tmp/streak.svg
          if grep -q "<svg" /tmp/streak.svg && grep -q "</svg>" /tmp/streak.svg && ! grep -qiE "unable to|rate limit|error|exception" /tmp/streak.svg; then
            mv /tmp/streak.svg profile/streak.svg
          else
            echo "Streak SVG validation failed; keeping existing profile/streak.svg"
            rm -f /tmp/streak.svg
          fi

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore(stats): update README stats cards"
          git push
